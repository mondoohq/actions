name: Test xgrep scanning

on:
  pull_request:
    paths:
      - "xgrep/**"
      - ".github/test_files/xgrep/**"
      - ".github/workflows/xgrep.yaml"
  push:
    branches:
      - main

jobs:
  build:
    name: Scan and report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Run xgrep
        uses: ./xgrep
        with:
          path: ./.github/test_files/xgrep
          output-file: "custom-results.sarif"
      - name: Archive SARIF results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xgrep-report
          path: custom-results.sarif

  # The three jobs below cover what the scan job cannot: the scan runs with
  # fail-on off, so nothing there exercises the gate, and its fixtures produce
  # only info-level findings, which no fail-on setting reacts to.

  gate-blocks:
    name: Gate fails on an unsuppressed finding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # `xgrep ci` is diff-aware and needs history to resolve its baseline.
          fetch-depth: 0
      # `xgrep ci` is diff-aware, for every repository that uses this action. So the
      # test gives it a real diff rather than a contrived baseline: it copies the
      # fixture to a new path and commits it, which is precisely the shape of the
      # pull request a user would open. The commit is local to the runner and never
      # pushed.
      #
      # This also isolates each job for free. Only the fixture a job stages is new,
      # so only that one is scanned -- the sibling fixture stays old and invisible,
      # with no --include or --exclude needed to keep them apart.
      - name: Stage the fixture as a change on this branch
        run: |
          set -euo pipefail
          git config user.name "xgrep action test"
          git config user.email "noreply@mondoo.com"
          cp .github/test_files/xgrep/gate/blocking.js under-test.js
          git add under-test.js
          git commit -q -m "test: stage blocking fixture"
      - name: Scan the staged fixture
        id: scan
        continue-on-error: true
        uses: ./xgrep
        with:
          path: .
          output-file: blocking.sarif
          fail-on: error
      - name: The gate must have failed
        run: |
          set -euo pipefail
          echo "action outcome: ${{ steps.scan.outcome }}"
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::fail-on=error did not fail on an active error-level finding"
            jq '.runs[].results[]?' blocking.sarif || true
            exit 1
          fi

  gate-honours-suppression:
    name: Gate ignores a suppressed finding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # `xgrep ci` is diff-aware and needs history to resolve its baseline.
          fetch-depth: 0
      # No continue-on-error: this step passing IS the assertion. The fixture holds
      # the same error-level finding as the job above, suppressed with a `nogrep:`
      # comment, so a gate that counts suppressed findings fails here.
      # `xgrep ci` is diff-aware, for every repository that uses this action. So the
      # test gives it a real diff rather than a contrived baseline: it copies the
      # fixture to a new path and commits it, which is precisely the shape of the
      # pull request a user would open. The commit is local to the runner and never
      # pushed.
      #
      # This also isolates each job for free. Only the fixture a job stages is new,
      # so only that one is scanned -- the sibling fixture stays old and invisible,
      # with no --include or --exclude needed to keep them apart.
      - name: Stage the fixture as a change on this branch
        run: |
          set -euo pipefail
          git config user.name "xgrep action test"
          git config user.email "noreply@mondoo.com"
          cp .github/test_files/xgrep/gate/suppressed.js under-test.js
          git add under-test.js
          git commit -q -m "test: stage suppressed fixture"
      - name: Scan the staged fixture
        uses: ./xgrep
        with:
          path: .
          output-file: suppressed.sarif
          fail-on: error
      - name: The finding must still be reported, just not blocking
        run: |
          set -euo pipefail
          total=$(jq '[.runs[].results[]?] | length' suppressed.sarif)
          supp=$(jq '[.runs[].results[]? | select((.suppressions // []) | length > 0)] | length' suppressed.sarif)
          active=$(jq '[.runs[].results[]? | select(.level == "error")
            | select((.suppressions // []) | length == 0)] | length' suppressed.sarif)
          echo "results: $total total, $supp suppressed, $active active error-level"

          # Assert the property, not a count. The action installs xgrep `latest`, so
          # how many rules match this fixture changes over time and a hard-coded
          # number turns an unrelated rule addition into a failing test.
          #
          # Suppression marks a finding rather than deleting it, so the SARIF must
          # still carry it — that is what lets code scanning show it as dismissed.
          if [ "$supp" -lt 1 ]; then
            echo "::error::the suppressed finding is missing from the SARIF entirely"
            exit 1
          fi
          if [ "$active" -ne 0 ]; then
            echo "::error::$active error-level finding(s) were not suppressed"
            jq -r '.runs[].results[]? | select(.level == "error")
              | select((.suppressions // []) | length == 0) | "  \(.ruleId)"' suppressed.sarif
            exit 1
          fi

  args-quoting:
    name: args honours shell quoting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # `xgrep ci` is diff-aware and needs history to resolve its baseline.
          fetch-depth: 0
      # A quoted glob is the natural way to write this, and it used to reach xgrep
      # with the apostrophes attached, matching nothing and excluding nothing.
      # `xgrep ci` is diff-aware, for every repository that uses this action. So the
      # test gives it a real diff rather than a contrived baseline: it copies the
      # fixture to a new path and commits it, which is precisely the shape of the
      # pull request a user would open. The commit is local to the runner and never
      # pushed.
      #
      # This also isolates each job for free. Only the fixture a job stages is new,
      # so only that one is scanned -- the sibling fixture stays old and invisible,
      # with no --include or --exclude needed to keep them apart.
      - name: Stage the fixture as a change on this branch
        run: |
          set -euo pipefail
          git config user.name "xgrep action test"
          git config user.email "noreply@mondoo.com"
          cp .github/test_files/xgrep/gate/blocking.js under-test.js
          git add under-test.js
          git commit -q -m "test: stage blocking fixture"
      - name: Scan with a quoted --exclude covering the staged fixture
        uses: ./xgrep
        with:
          path: .
          output-file: quoted.sarif
          # Without the staging step above the tree would scan clean anyway, and
          # this test would report zero findings whether or not the exclusion
          # worked -- passing for the wrong reason, and unable to catch the bug it
          # exists for. Measured on a staged fixture: quotes stripped gives 0,
          # quotes left attached gives 1.
          args: "--exclude 'under-test.js'"
      - name: The exclusion must have applied
        run: |
          set -euo pipefail
          n=$(jq '[.runs[].results[]?] | length' quoted.sarif)
          echo "results with the quoted exclusion: $n (without it, the staged fixture gives 1)"
          if [ "$n" -ne 0 ]; then
            echo "::error::a quoted --exclude pattern did not apply; $n finding(s) reported"
            jq -r '.runs[].results[]? | .ruleId' quoted.sarif
            exit 1
          fi

  scan-failure-is-not-a-pass:
    name: A scan that produces no report fails
    runs-on: ubuntu-latest
    steps:
      # Deliberately shallow: no fetch-depth. `xgrep ci` is diff-aware, cannot
      # resolve its baseline without history, and exits 0 after printing an error
      # without writing a report. The action must not call that a pass.
      #
      # This is the shape that makes a security gate dangerous rather than merely
      # broken: before this was fixed, the scan step reported success, the gate
      # found no file and skipped itself, and a job asking for `fail-on: error`
      # went green having scanned nothing at all.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Scan with a checkout xgrep ci cannot baseline
        id: scan
        continue-on-error: true
        uses: ./xgrep
        with:
          path: ./.github/test_files/xgrep/gate
          output-file: shallow.sarif
          fail-on: error
      - name: The action must have failed, not passed with no report
        run: |
          set -euo pipefail
          echo "action outcome: ${{ steps.scan.outcome }}"
          if [ "${{ steps.scan.outcome }}" != "failure" ]; then
            echo "::error::a scan that produced no report was reported as a pass"
            exit 1
          fi
          if [ -f shallow.sarif ]; then
            echo "::error::expected no report, but shallow.sarif exists"
            exit 1
          fi
